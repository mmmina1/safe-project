server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Gzip은 유니티 압축 파일과 충돌할 수 있으므로 명시적으로 끔
    gzip off;
    
    # Docker/Cloud 환경에서 대용량 파일 전송 안정성을 위해 sendfile 끔 (truncated download 방지)
    sendfile off;
    tcp_nopush off;
    
    # 안정적인 연결을 위한 타임아웃 설정
    keepalive_timeout 65;
    
    # 로그 설정 (디버깅 용도)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Frontend 정적 파일 서빙
    location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 유니티 빌드 파일들에 대한 명시적 헤더 및 MIME 타입 설정
    # HTTP 환경이므로 Brotli 대신 Gzip을 우선적으로 지원하도록 설정
    
    location ~* \.framework\.js\.gz$ {
        add_header Content-Encoding gzip;
        add_header Vary Accept-Encoding;
        add_header Cache-Control "public, max-age=0";
        add_header Access-Control-Allow-Origin *;
        default_type application/javascript;
    }

    location ~* \.wasm\.gz$ {
        add_header Content-Encoding gzip;
        add_header Vary Accept-Encoding;
        add_header Cache-Control "public, max-age=0";
        add_header Access-Control-Allow-Origin *;
        default_type application/wasm;
    }

    location ~* \.data\.gz$ {
        add_header Content-Encoding gzip;
        add_header Vary Accept-Encoding;
        add_header Cache-Control "public, max-age=0";
        add_header Access-Control-Allow-Origin *;
        default_type application/octet-stream;
    }

    # 브라우저가 직접 압축을 풀 수 없는 경우(HTTP에서의 Brotli 등)를 대비해 
    # .br 보다는 .gz 또는 원본 파일 서빙을 권장하지만, .br 요청이 올 경우의 처리
    location ~* \.framework\.js\.br$ {
        add_header Content-Encoding br;
        add_header Vary Accept-Encoding;
        add_header Cache-Control "public, max-age=0";
        add_header Access-Control-Allow-Origin *;
        default_type application/javascript;
    }

    location ~* \.wasm\.br$ {
        add_header Content-Encoding br;
        add_header Vary Accept-Encoding;
        add_header Cache-Control "public, max-age=0";
        add_header Access-Control-Allow-Origin *;
        default_type application/wasm;
    }

    location ~* \.data\.br$ {
        add_header Content-Encoding br;
        add_header Vary Accept-Encoding;
        add_header Cache-Control "public, max-age=0";
        add_header Access-Control-Allow-Origin *;
        default_type application/octet-stream;
    }

    # Backend API 프록시
    location /api {
        proxy_pass http://safe-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 이미지 및 파일 프록시
    location /uploads {
        proxy_pass http://safe-backend:8080;
    }

    location /bin {
        proxy_pass http://safe-backend:8080;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
