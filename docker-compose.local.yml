services:
  safe-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safe-backend-local
    environment:
      DB_URL: jdbc:mysql://172.31.43.126:3306/safe_db?serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: admin
      DB_PASSWORD: safe1234
      JWT_SECRET: test_secret_test_secret_test_secret_test_secret_1234567890
      KAKAO_CLIENT_ID: dummy
      KAKAO_REDIRECT_URI: http://localhost:5173
      GOOGLE_CLIENT_ID: dummy
      GOOGLE_CLIENT_SECRET: dummy
      GOOGLE_REDIRECT_URI: http://localhost:5173
      AWS_S3_BUCKET: dummy
      AWS_REGION: ap-northeast-2
      AWS_ACCESS_KEY: dummy
      AWS_SECRET_KEY: dummy
      TOSS_PAYMENTS_SECRET_KEY: dummy
      PORT: "8080"
      SPRING_PROFILES_ACTIVE: local
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost,http://127.0.0.1"
      PYTHON_BACKEND_URL: http://safe-python-backend:8000
    ports:
      - "8081:8080"
    depends_on:
      - safe-python-backend
    restart: unless-stopped

  safe-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safe-frontend-local
    ports:
      - "80:80"
    environment:
      NODE_ENV: development
      VITE_API_URL: "/api"
    depends_on:
      - safe-backend
    restart: unless-stopped

  safe-python-backend:
    build:
      context: ./backend-python/py
      dockerfile: Dockerfile
    container_name: safe-python-backend-local
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy}
      PYTHONIOENCODING: utf-8
      PYTHONPATH: /app/backend
      PYTHON_BACKEND_URL: http://safe-python-backend:8000
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/backend/chroma_db
    restart: unless-stopped
